# Example of a minimal image with auto-app RPM installed

name: auto-app

image:
  hostname: auto-app
  selinux_mode: enforcing

content:
  repos:
    - id: epel
      baseurl: https://ftp-stud.hs-esslingen.de/pub/epel/10.4/Everything/aarch64/
      priority: 20
    - id: bigmachine
      baseurl: http://rpmrepo-rpmrepo.apps.ocp.boernig.name/AutoSD-AT/repos/10-stream/
      priority: 10
    - id: local
      baseurl: file:///workspace/export/
      priority: 5      
  rpms:
    - auto-app
    #- pcp-pmda-bpf
    #- pcp-pmda-bpftrace
    #- pcp-pmda-podman
    #- pcp-pmda-openmetrics
    #- pcp-system-tools
    #- pcp-zeroconf
    - procps
    - valkey
    - bluechi-controller
    - bluechi-agent
    - rtla
    - vim
    - curl
    - gdb
    - greenboot-default-health-checks
    - iproute
    - iputils
    - less
    - openssh-clients
    - openssh-server
    - pciutils
    - podman
    - python3-pip
    - qm
    - strace
    #- stress-ng
    - tcpdump
    - tmux
    - xauth
    - xterm
    - auto-apps
    - auto-apps-selinux
    - dlt-daemon
    - dlt-tools
    - container-selinux
    - selinux-policy-automotive
    - vsomeip3-routingmanager
    - vsomeip3-selinux
    - vsomeip3-tools
    - policycoreutils-python-utils
    - setools-console
    - audit
  container_images:
    - source: quay.io/shetze/auto-apps
      tag: 'latest'
      name: localhost/auto-apps
      containers-transport: docker
    - source: quay.io/shetze/ffi_server-arm64
      tag: latest
      name: localhost/ffi_server
      containers-transport: docker
    #- source: quay.io/shetze/sysbench-arm64
    #  tag: latest
    #  name: localhost/sysbench
    #  containers-transport: docker
    #- source: quay.io/shetze/stress-ng-arm64
    #  tag: latest
    #  name: localhost/stress-ng
    #  containers-transport: docker
  make_dirs:
    - path: /etc/containers/systemd/qm.container.d
      parents: true
      exist_ok: true
    - path: /etc/qm/containers/systemd/
      parents: true
      exist_ok: true
    - path: /etc/systemd/system/sockets.target.wants
      parents: true
      exist_ok: true
    - path: /etc/ssh/authorized_keys
      mode: 0755
      parents: true
      exist_ok: true
    - path: /etc/sysconfig
      mode: 0755
      parents: true
      exist_ok: true
    - path: /etc/systemd/system
      mode: 0755
      parents: true
      exist_ok: true
    #- path: /usr/lib/webui
    #  mode: 0755
    #  parents: true
    #  exist_ok: true
    #- path: /usr/lib/openmetrics-static
    #  mode: 0755
    #  parents: true
    #  exist_ok: true
  add_files:
    - path: /etc/selinux/config
      text: |
        SELINUX=enforcing
        SELINUXTYPE=automotive
    - path: /usr/lib/tmpfiles.d/relabel.conf
      text: |
        Z /run/ipc - - - -
    - path: /usr/lib/tmpfiles.d/vsomeip3.conf
      text: |
        D /run/ipc/vsomeip 01777 root root -
        L /run/vsomeip - - - - /run/ipc/vsomeip
    - path: /usr/lib/tmpfiles.d/dlt.conf
      text: |
        D /run/ipc/dlt 01777 root root -
        L /run/dlt - - - - /run/ipc/dlt
    - path: /usr/lib/systemd/system/dlt.service
      text: |
        [Unit]
        Description=COVESA DLT logging daemon
        Documentation=man:dlt-daemon(1) man:dlt.conf(5)
        DefaultDependencies=no
        Before=shutdown.target
        Conflicts=shutdown.target
        After=tmp.mount
        Requires=dlt.socket
        
        [Service]
        Type=simple
        User=dlt-daemon
        ExecStart=/usr/bin/dlt-daemon
        # WatchdogSec=2
        NotifyAccess=main
        LimitCORE=infinity
        
        [Install]
        WantedBy=multi-user.target
    - path: /usr/lib/systemd/system/dlt.socket
      text: |
        [Unit]
        Description=vsomeip routing manager activation socket
        After=systemd-tmpfiles-setup.service
        
        [Socket]
        ListenStream=%t/dlt/dlt.socket
        SocketUser=root
        SocketGroup=root
        SELinuxContextFromNet=yes
        
        [Install]
        WantedBy=sockets.target
    - path: /usr/lib/systemd/system/routingmanagerd.socket
      text: |
        [Unit]
        Description=vsomeip routing manager activation socket
        After=systemd-tmpfiles-setup.service
        
        [Socket]
        ListenStream=%t/vsomeip/vsomeip-0
        SocketUser=routingmanagerd
        SocketGroup=routingmanagerd
        SELinuxContextFromNet=yes
        
        [Install]
        WantedBy=sockets.target
    - path: /etc/containers/systemd/qm.container.d/vsomeip-qm.conf
      text: |
        [Container]
        Volume=/run/ipc/:/run/ipc/
        Volume=/run/vsomeip/:/run/vsomeip/
        Volume=/run/dlt/:/run/dlt/
    - path: /etc/containers/systemd/dlt.container
      text: |
        [Unit]
        Description=COVESA DLT logging daemo (asil-to-qm)
        Before=shutdown.target
        Conflicts=shutdown.target
        After=tmp.mount
        Requires=dlt.socket
        
        [Container]
        Image=localhost/auto-apps
        Network=none
        Volume=/run/vsomeip/:/run/vsomeip/
        Volume=/run/dlt/:/run/dlt/
        SecurityLabelType=ipc_t
        Exec=/usr/bin/dlt-daemon
        
        [Service]
        Restart=always
        Type=notify
        NotifyAccess=main
        LimitCORE=infinity
        
        [Install]
        WantedBy=multi-user.target
    - path: /etc/containers/systemd/engine.container
      text: |
        [Unit]
        Description=engine service container (asil-to-qm)
        Requires=routingmanagerd.service
        After=routingmanagerd.service
        
        [Container]
        Image=localhost/auto-apps
        Network=none
        Environment=SOCKET_PATH=/run/vsomeip/vsomeip-0
        Environment=ENGINE_DEMO_CPU_MS=300
        Environment=ENGINE_DEMO_HOLD_MUTEX=1
        Volume=/var/run/vsomeip/:/var/run/vsomeip/
        Volume=/var/run/dlt/:/var/run/dlt/
        SecurityLabelType=ipc_t
        Exec=/usr/bin/engine-service
        
        [Service]
        Restart=always
        Type=notify
        
        [Install]
        WantedBy=multi-user.target
    - path: /etc/vsomeip.json
      text: |
        {
          "routing": {
            "host": {
              "name": "routingmanagerd",
              "unicast": "10.88.0.1",
              "port": "31000"
            },
            "guests": {
              "unicast": "10.88.0.1",
              "ports": [
                {
                  "first": "1026",
                  "last": "65535"
                }
              ]
            }
          },
          "logging": {
            "level": "info",
            "console": "true",
            "dlt": "false"
          },
          "applications": [
            {
              "name": "routingmanagerd",
              "id": "0x0101"
            },
            {
              "name": "Radio",
              "id": "0x1000"
            },
            {
              "name": "Engine",
              "id": "0x1001"
            },
            {
              "name": "Radio client",
              "id": "0x1002"
            }
          ],
          "services": [
            {
              "service": "0x1000",
              "instance": "0x01",
              "unreliable": "30509"
            },
            {
              "service": "0x1001",
              "instance": "0x01",
              "unreliable": "30509"
            }
          ],
          "service-discovery": {
            "enable": "true",
            "multicast": "224.224.224.245",
            "port": "30490",
            "protocol": "tcp",
            "initial_delay_min": "10",
            "initial_delay_max": "100",
            "repetitions_base_delay": "200",
            "repetitions_max": "3",
            "ttl": "3",
            "cyclic_offer_delay": "2000",
            "request_response_delay": "1500"
          }
        }
    - path: /etc/systemd/system/ffi_server.socket
      source_path: systemd/ffi_server.socket
    - path: /etc/containers/systemd/ffi_server.container
      source_path: systemd/ffi_server.container
    #- path: /etc/containers/systemd/qm.container.d/10-ipc-demo.conf
    #  source_path: systemd/10-ipc-demo.conf
    - path: /etc/containers/systemd/qm.container.d/20-oom-score-adjust-demo.conf
      source_path: systemd/20-oom-score-adjust-demo.conf
    #- path: /etc/sysconfig/pmcd
    #  source_path: sysconfig/pmcd
    #- path: /etc/systemd/system/cyclictest.service
    #  source_path: systemd/cyclictest.service
    #- path: /etc/systemd/system/sysbench.service
    #  source_path: systemd/sysbench.service
    #- path: /etc/systemd/system/stress-ng.service
    #  source_path: systemd/stress-ng.service
    #- path: /usr/bin/run_sysbench.sh
    #  source_path: files/run_sysbench.sh
    #- path: /usr/bin/run_cyclictest.sh
    #  source_path: files/run_cyclictest.sh
    #- path: /usr/bin/cycle_stress-ng.sh
    #  source_path: files/cycle_stress-ng.sh
    #- path: /usr/lib/tmpfiles.d/openmetrics_pmda.conf
    #  source_path: files/openmetrics_pmda.conf
    #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.sysbench
    #  source_path: files/pmdas_openmetrics.sysbench
    #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.cyclictest
    #  source_path: files/pmdas_openmetrics.cyclictest
    #- path: /etc/pcp/openmetrics/asil_sysbench.url
    #  source_path: pmdas/asil_sysbench.url
    #- path: /etc/pcp/openmetrics/qm_sysbench.url
    #  source_path: pmdas/qm_sysbench.url
    #- path: /etc/pcp/openmetrics/cyclictest.url
    #  source_path: pmdas/cyclictest.url
    #- path: /etc/pcp/openmetrics/qm_high_prio_app.url
    #  source_path: pmdas/qm_high_prio_app.url
    #- path: /etc/pcp/openmetrics/qm_low_prio_app.url
    #  source_path: pmdas/qm_low_prio_app.url
    #- path: /etc/pcp/openmetrics/.NeedInstall
    #  source_path: pmdas/NeedInstall
    - path: /etc/ssh/authorized_keys/root
      source_path: files/authorized_keys
    - path: /etc/ssh/sshd_config.d/99-authorized-keys-path.conf
      source_path: files/99-authorized-keys-path.conf
    #- path: /usr/bin/webui.py
    #  source_path: webui/webui.py
    #- path: /usr/lib/webui/index.html
    #  source_path: webui/index.html
    #- path: /etc/systemd/system/webui.service
    #  source_path: systemd/webui.service
  chmod_files:
    #- path: /usr/bin/run_sysbench.sh
    #  mode: "0755"
    #- path: /usr/bin/run_cyclictest.sh
    #  mode: "0755"
    #- path: /usr/bin/cycle_stress-ng.sh
    #  mode: "0755"
    #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.sysbench
    #  mode: "0644"
    #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.cyclictest
    #  mode: "0644"
    #- path: /var/lib/pcp/config/pmda
    #  mode: "0777"
    - path: /etc/ssh/authorized_keys/root
      mode: "0600"
    - path: /etc/ssh/sshd_config.d/99-authorized-keys-path.conf
      mode: "0644"
    #- path: /usr/bin/webui.py
    #  mode: "0755"
  add_symlinks:
    - link: /etc/systemd/system/sockets.target.wants/routingmanagerd.socket
      target: /usr/lib/systemd/system/routingmanagerd.socket
  systemd:
    enabled_services:
      # Enable ssh daemon
      - sshd.service
      - routingmanagerd.service
      - dlt.service
      - ffi_server.socket
      #- pmcd.service
      #- pmproxy.service
      #- webui.service
    disabled_services:
      - valkey.service
      - cyclictest.service
      - stress-ng.service
      - sysbench.service
      - pmie.service
      - pmlogger.service


qm:
  memory_limit:
    # Do not allow QM to use more than 50% of memory before OOM kicks in
    max: 20%
  content:
    repos:
      - id: epel
        baseurl: https://ftp-stud.hs-esslingen.de/pub/epel/10.4/Everything/aarch64/
        priority: 20
      - id: bigmachine
        baseurl: http://rpmrepo-rpmrepo.apps.ocp.boernig.name/AutoSD-AT/repos/10-stream/
        priority: 10
    rpms:
      - python3-pip
      - vim
      - iproute
      - curl
      - strace
      - iputils
      - tcpdump
      - auto-apps
      - stress-ng
    container_images:
      - source: quay.io/centos/arm64v8
        tag: stream10
        name: localhost/cs10      
      - source: quay.io/shetze/auto-apps
        tag: 'latest'
        name: localhost/auto-apps
      - source: quay.io/shetze/ffi_client-arm64
        tag: latest
        name: localhost/ffi_client
        containers-transport: docker
      - source: quay.io/shetze/sysbench-arm64
        tag: latest
        name: localhost/sysbench
        containers-transport: docker
      - source: quay.io/shetze/stress-ng-arm64
        tag: latest
        name: localhost/stress-ng
        containers-transport: docker
    make_dirs:
      - path: /etc/containers/systemd
        mode: 0755
        parents: true
        exist_ok: true
      - path: /usr/lib/openmetrics-static
        mode: 0755
        parents: true
        exist_ok: true
    add_files:
      - path: /etc/containers/systemd/dlt.container
        text: |
          [Unit]
          Description=dlt service container (asil-to-qm)
          
          [Container]
          Image=localhost/auto-apps
          Network=none
          Volume=/run/vsomeip/:/run/vsomeip/
          Volume=/run/dlt/:/run/dlt/
          Volume=/run/ipc/:/run/ipc/
          SecurityLabelType=qm_container_ipc_t
          Exec=/usr/bin/dlt-daemon
          
          [Service]
          Restart=always
          Type=notify
          
          [Install]
          WantedBy=multi-user.target
      - path: /etc/containers/systemd/routingmanagerd.container
        text: |
          [Unit]
          Description=vsomeip routingmanager container (asil-to-qm)
          After=dlt.service
          
          [Container]
          Image=localhost/auto-apps
          Network=none
          Environment=SOCKET_PATH=/run/vsomeip/vsomeip-0
          Volume=/run/vsomeip/:/run/vsomeip/
          Volume=/run/dlt/:/run/dlt/
          Volume=/run/ipc/:/run/ipc/
          SecurityLabelType=qm_container_ipc_t
          Exec=/usr/bin/routingmanagerd
          
          [Service]
          Restart=always
          Type=notify
          
          [Install]
          WantedBy=multi-user.target
      - path: /etc/containers/systemd/radio.container
        text: |
          [Unit]
          Description=radio service container (asil-to-qm)
          
          [Container]
          Image=localhost/auto-apps
          Environment=SOCKET_PATH=/run/vsomeip/vsomeip-0
          Environment=RADIO_DEMO_CPU_MS=300
          Environment=RADIO_DEMO_HOLD_MUTEX=1
          Environment=RADIO_DEMO_RAM_SIZE=8G
          Volume=/run/vsomeip/:/run/vsomeip/
          Volume=/run/dlt/:/run/dlt/
          Volume=/run/ipc/:/run/ipc/
          SecurityLabelType=qm_container_ipc_t
          # SecurityLabelLevel=s0
          Network=host
          Exec=/usr/bin/radio-service
          
          [Service]
          Restart=always
          
          [Install]
          WantedBy=multi-user.target
      - path: /etc/vsomeip.json
        text: |
          {
            "routing": {
              "host": {
                "name": "routingmanagerd",
                "unicast": "10.88.0.1",
                "port": "31000"
              },
              "guests": {
                "unicast": "10.88.0.1",
                "ports": [
                  {
                    "first": "1026",
                    "last": "65535"
                  }
                ]
              }
            },
            "logging": {
              "level": "info",
              "console": "true",
              "dlt": "false"
            },
            "applications": [
              {
                "name": "routingmanagerd",
                "id": "0x0101"
              },
              {
                "name": "Radio",
                "id": "0x1000"
              },
              {
                "name": "Engine",
                "id": "0x1001"
              },
              {
                "name": "Radio client",
                "id": "0x1002"
              }
            ],
            "services": [
              {
                "service": "0x1000",
                "instance": "0x01",
                "unreliable": "30509"
              },
              {
                "service": "0x1001",
                "instance": "0x01",
                "unreliable": "30509"
              }
            ],
            "service-discovery": {
              "enable": "true",
              "multicast": "224.224.224.245",
              "port": "30490",
              "protocol": "tcp",
              "initial_delay_min": "10",
              "initial_delay_max": "100",
              "repetitions_base_delay": "200",
              "repetitions_max": "3",
              "ttl": "3",
              "cyclic_offer_delay": "2000",
              "request_response_delay": "1500"
            }
          }
      - path: /etc/containers/systemd/ffi_client.container
        source_path: systemd/ffi_client.container
      - path: /etc/systemd/system/sysbench.service
        source_path: systemd/sysbench.service
      - path: /usr/bin/run_sysbench.sh
        source_path: files/run_sysbench.sh
      #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.sysbench
      #  source_path: files/pmdas_openmetrics.sysbench
      #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.qm_high_prio_app
      #  source_path: files/pmdas_openmetrics.sysbench
      #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.qm_low_prio_app
      #  source_path: files/pmdas_openmetrics.sysbench
      #- path: /usr/lib/tmpfiles.d/qm_openmetrics_seeds.conf
      #  source_path: files/qm_openmetrics_seeds.conf
      #- path: /usr/bin/run_log_collector.sh
      #  source_path: files/run_log_collector.sh
      #- path: /etc/containers/systemd/qm_high_prio_app.container
      #  source_path: systemd/qm_high_prio_app.container
      #- path: /etc/containers/systemd/qm_low_prio_app.container
      #  source_path: systemd/qm_low_prio_app.container
      #- path: /etc/systemd/system/log_collector@.service
      #  source_path: systemd/log_collector@.service
      - path: /etc/containers/systemd/stress-ng_high_prio@.container
        source_path: systemd/stress-ng_high_prio@.container
      - path: /etc/containers/systemd/stress-ng_low_prio@.container
        source_path: systemd/stress-ng_low_prio@.container

    chmod_files:
      - path: /usr/bin/run_sysbench.sh
        mode: "0755"
      #- path: /usr/bin/run_log_collector.sh
      #  mode: "0755"
      #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.sysbench
      #  mode: "0644"
      #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.qm_high_prio_app
      #  mode: "0644"
      #- path: /usr/lib/openmetrics-static/pmdas_openmetrics.qm_low_prio_app
      #  mode: "0644"


