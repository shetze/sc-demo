apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mock-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  serviceName: mock-exporter
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mock-exporter
  template:
    metadata:
      labels:
        app: mock-exporter
    annotations:
        openshift.io/required-scc: privileged
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: auto.node-role/builder
                operator: In
                values:
                - "true"
      serviceAccountName: mock-exporter
      restartPolicy: Always
      volumes:
        - name: registry-ca
          configMap:
            name: registry-service-ca

      initContainers:
        - name: jumpstarter-init
          image: ghcr.io/rhadp-examples/rhas-exporter:latest
          imagePullPolicy: Always
          env:
            - name: JMP_NAMESPACE
              value: "auto-jumpstarter"
          command:
            - /bin/bash
            - -c
            - |
              set -eo pipefail
              source /venv/bin/activate

              # Extract the values from the service account
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              API_SERVER=$(oc whoami --show-server)

              # set ./kube/config correctly
              mkdir -p ~/.kube

              oc config set-cluster rhas \
                --server=$API_SERVER \
                --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              oc config set-credentials mock-exporter \
                --token=$TOKEN

              oc config set-context mock-exporter-ctx \
                --cluster=rhas \
                --user=mock-exporter \
                --namespace=$NAMESPACE

              oc config use-context mock-exporter-ctx

              # check if exporter already exists and delete it if so ...

              EXPORTER_NAME=$(cat /etc/hostname)
              if oc get exporter "$EXPORTER_NAME" -n $JMP_NAMESPACE &>/dev/null; then
                echo "Exporter '$EXPORTER_NAME' already exists, deleting it now ..."
                oc delete exporter "$EXPORTER_NAME" -n $JMP_NAMESPACE || true
              fi

      containers:
        - name: jumpstarter-exporter
          image: ghcr.io/rhadp-examples/rhas-exporter:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 1.0
              memory: "2G"
            requests:
              cpu: 0.5
              memory: "1G"
          securityContext:
            privileged: true
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    source /venv/bin/activate

                    EXPORTER_NAME=$(cat /etc/hostname)
                    echo "Pod is terminating, deleting exporter '$EXPORTER_NAME' ..."

                    # ~/.kube/config was already set up by the container's
                    # main command on startup, so oc is already authenticated
                    timeout 20s oc delete exporter "$EXPORTER_NAME" -n "$JMP_NAMESPACE" --ignore-not-found || true
          volumeMounts:
            - mountPath: /etc/pki/ca-trust/source/anchors/service-ca-bundle.crt
              name: registry-ca
              subPath: service-ca-bundle.crt
              readOnly: true
          env:
            - name: JUMPSTARTER_GRPC_INSECURE
              value: "1"
            - name: JMP_NAMESPACE
              value: "auto-jumpstarter"
            - name: OCI_USERNAME
              value: "serviceaccount"
            - name: UPDATE_DRIVERS
              value: "0"
          command:
            - /bin/bash
            - -c
            - |
              set -eo pipefail
              source /venv/bin/activate

              # Trust the internal registry's service-serving CA
              if [ -f /etc/pki/ca-trust/source/anchors/service-ca-bundle.crt ]; then
                  update-ca-trust
              fi

              # debugging - update to latest jumpstarter version and qemu drivers
              if [ "$UPDATE_DRIVERS" = "1" ]; then
                echo "Updating jumpstarter version and qemu drivers ..."

                uv pip install --reinstall \
                  "git+${JUMPSTARTER_REPO}@${JUMPSTARTER_VERSION}#subdirectory=python/packages/jumpstarter-all" \
                  "git+${RHAS_STARTER_REPO}@${RHAS_STARTER_VERSION}#subdirectory=packages/rhas-driver-qemu" \
                  "git+${RHAS_STARTER_REPO}@${RHAS_STARTER_VERSION}#subdirectory=packages/rhas-driver-opendal" \
                  "git+${RHAS_STARTER_REPO}@${RHAS_STARTER_VERSION}#subdirectory=packages/rhas-driver-power"
              fi 

              # Extract the values from the service account
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              API_SERVER=$(oc whoami --show-server)

              # upstream jumpstarter's OCI credential resolution only reads
              # OCI_USERNAME/OCI_PASSWORD from the environment (no *_FILE
              # fallback), so export the SA token here rather than pointing
              # OCI_PASSWORD_FILE at it
              export OCI_PASSWORD="$TOKEN"

              # set ./kube/config correctly
              mkdir -p ~/.kube

              oc config set-cluster rhadp \
                --server=$API_SERVER \
                --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              oc config set-credentials mock-exporter \
                --token=$TOKEN

              oc config set-context mock-exporter-ctx \
                --cluster=rhadp \
                --user=mock-exporter \
                --namespace=$NAMESPACE

              oc config use-context mock-exporter-ctx

              # create the exporter config
              EXPORTER_NAME=$(cat /etc/hostname)

              # delete the exporter if it already exists
              timeout 30s oc delete exporter "$EXPORTER_NAME" -n "$JMP_NAMESPACE" --ignore-not-found || true

              # create the exporter config
              jmp admin create exporter "$EXPORTER_NAME" -n $JMP_NAMESPACE --label type=virtual --label device=mock --save --insecure-tls --nointeractive --out ./dummy.yaml
              TOKEN=$(yq '.token' dummy.yaml)
              echo "$TOKEN" > token

              # remove the exporter config
              rm ./dummy.yaml

              # detect the endpoint
              while [ -z "$ENDPOINT" ]
              do
                ENDPOINT=$(kubectl get -n $JMP_NAMESPACE \
                  exporters.jumpstarter.dev $(cat /etc/hostname) -o jsonpath="{.status.endpoint}")
                sleep 1s
              done
              echo "$ENDPOINT" > endpoint

              cat <<EOF > mock-exporter.yaml
              apiVersion: jumpstarter.dev/v1alpha1
              kind: ExporterConfig
              metadata:
                namespace: $JMP_NAMESPACE
                name: $(cat /etc/hostname)
              endpoint: $(cat endpoint)
              tls:
                ca: ''
                insecure: true
              token: $(cat token)
              export:
                storage:
                  type: rhas_driver_opendal.driver.MockFlasher
                power:
                  type: rhas_driver_power.driver.MockPower
              EOF

              sleep 30s

              echo "Starting the exporter ..."
              jmp run --exporter-config mock-exporter.yaml

              #while true; do
              #  sleep 30s
              #done
